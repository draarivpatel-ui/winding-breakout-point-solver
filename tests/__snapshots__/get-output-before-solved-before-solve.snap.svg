a-y="-2" cx="414.55998630083286" cy="481.3344907680032" r="3.8654015414496583" fill="#d9770670" stroke="#d97706" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="-5.5" data-y="-2" cx="398.45414654479265" cy="481.3344907680032" r="3.8654015414496583" fill="#7c3aed70" stroke="#7c3aed" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="-5" data-y="-3" cx="414.55998630083286" cy="513.5461702800837" r="3.8654015414496583" fill="#05966970" stroke="#059669" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="-4.5" data-y="-2.5" cx="430.66582605687313" cy="497.4403305240435" r="3.8654015414496583" fill="#dc262670" stroke="#dc2626" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="-5" data-y="-2.5" cx="414.55998630083286" cy="497.4403305240435" r="3.8654015414496583" fill="#65a30d70" stroke="#65a30d" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="3.941917" data-y="-3.650917" cx="702.5941509284571" cy="534.5133000730486" r="3.8654015414496583" fill="#0f766e70" stroke="#0f766e" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="4.591917" data-y="-3.650917" cx="723.5317426113094" cy="534.5133000730486" r="3.8654015414496583" fill="#c2410c70" stroke="#c2410c" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="5.891917" data-y="-3.650917" cx="765.406925977014" cy="534.5133000730486" r="3.8654015414496583" fill="#2563eb70" stroke="#2563eb" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="6.541917" data-y="-3.650917" cx="786.3445176598664" cy="534.5133000730486" r="3.8654015414496583" fill="#9333ea70" stroke="#9333ea" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="6.541917" data-y="-2.050917" cx="786.3445176598664" cy="482.9746128537198" r="3.8654015414496583" fill="#05966970" stroke="#059669" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="5.891917" data-y="-2.050917" cx="765.406925977014" cy="482.9746128537198" r="3.8654015414496583" fill="#dc262670" stroke="#dc2626" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="4.591917" data-y="-2.050917" cx="723.5317426113094" cy="482.9746128537198" r="3.8654015414496583" fill="#d9770670" stroke="#d97706" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="3.941917" data-y="-2.050917" cx="702.5941509284571" cy="482.9746128537198" r="3.8654015414496583" fill="#7c3aed70" stroke="#7c3aed" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="4.591917" data-y="-2.850917" cx="723.5317426113094" cy="508.7439564633842" r="3.8654015414496583" fill="#05966970" stroke="#059669" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="5.241917" data-y="-2.850917" cx="744.4693342941617" cy="508.7439564633842" r="3.8654015414496583" fill="#dc262670" stroke="#dc2626" stroke-width="0.03104464017857143"/><circle data-type="circle" data-label="" data-x="5.891917" data-y="-2.850917" cx="765.406925977014" cy="508.7439564633842" r="3.8654015414496583" fill="#65a30d70" stroke="#65a30d" stroke-width="0.03104464017857143"/><text data-type="text" data-label="soc" data-x="-9.5" data-y="10.97808" x="269.6074284964707" y="63.2887371258617" fill="#334155" font-size="10.951971034107366" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">soc</text><text data-type="text" data-label="ram" data-x="9.616916999999999" data-y="9.899083" x="885.3954321595138" y="98.04504268435801" fill="#334155" font-size="10.951971034107366" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">ram</text><text data-type="text" data-label="Input · Validated during setup" data-x="-16.62808" data-y="11.678080000000001" x="40" y="40.740561467405314" fill="#0f172a" font-size="13.528905395073805" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input · Validated during setup</text><text data-type="text" data-label="Region bounds, breakout edges, bus layer preferences, and canonical endpoints" data-x="-16.62808" data-y="11.30808" x="40" y="52.65888288687512" fill="#475569" font-size="8.052919878020122" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Region bounds, breakout edges, bus layer preferences, and canonical endpoints</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":32.21167951208049,"c":0,"e":575.6183838612353,"b":0,"d":-32.21167951208049,"f":416.91113174384225};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>