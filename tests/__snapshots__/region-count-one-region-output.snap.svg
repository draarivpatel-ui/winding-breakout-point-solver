  <g transform="translate(0, 88) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="-6,-1.6 -7,-0.625" data-type="line" data-label="" points="83.8601823708207,339.9665653495441 44.34650455927056,301.44072948328267" fill="none" stroke="#7c3aed55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-5.2,0 -7,-0.125" data-type="line" data-label="" points="115.4711246200608,276.74468085106383 44.34650455927056,281.6838905775076" fill="none" stroke="#65a30d55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,1.6 -7,0.375" data-type="line" data-label="" points="83.8601823708207,213.52279635258358 44.34650455927056,261.9270516717325" fill="none" stroke="#d9770655" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,-0.55 -7,-0.375" data-type="line" data-label="" points="83.8601823708207,298.47720364741645 44.34650455927056,291.56231003039517" fill="none" stroke="#2563eb55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,0.55 -7,0.125" data-type="line" data-label="" points="83.8601823708207,255.01215805471125 44.34650455927056,271.80547112462006" fill="none" stroke="#05966955" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><rect data-type="rect" data-label="" data-x="-6" data-y="0" x="44.34650455927056" y="158.2036474164134" width="79.02735562310028" height="237.0820668693009" fill="rgba(226, 232, 240, 0.035)" stroke="rgba(71, 85, 105, 0.55)" stroke-width="1.5"/></g><circle data-type="circle" data-label="" data-x="-5.2" data-y="0" cx="115.4711246200608" cy="276.74468085106383" r="4.741641337386018" fill="#65a30d70" stroke="#65a30d" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="-0.55" cx="83.8601823708207" cy="298.47720364741645" r="4.741641337386018" fill="#2563eb70" stroke="#2563eb" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="0.55" cx="83.8601823708207" cy="255.01215805471125" r="4.741641337386018" fill="#05966970" stroke="#059669" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="1.6" cx="83.8601823708207" cy="213.52279635258358" r="4.741641337386018" fill="#d9770670" stroke="#d97706" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="-1.6" cx="83.8601823708207" cy="339.9665653495441" r="4.741641337386018" fill="#7c3aed70" stroke="#7c3aed" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.625" cx="44.34650455927056" cy="301.44072948328267" r="4.3465045592705165" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.125" cx="44.34650455927056" cy="281.6838905775076" r="4.3465045592705165" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="0.375" cx="44.34650455927056" cy="261.9270516717325" r="4.3465045592705165" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.375" cx="44.34650455927056" cy="291.56231003039517" r="4.3465045592705165" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="0.125" cx="44.34650455927056" cy="271.80547112462006" r="4.3465045592705165" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><text data-type="text" data-label="source" data-x="-6" data-y="3.35" x="83.8601823708207" y="144.3738601823708" fill="#334155" font-size="13.434650455927052" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">source</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-7" data-y="4.05" x="44.34650455927056" y="116.71428571428572" fill="#0f172a" font-size="16.595744680851062" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-7" data-y="3.68" x="44.34650455927056" y="131.33434650455928" fill="#475569" font-size="9.878419452887538" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="DATA0 · inner1" data-x="-7" data-y="-0.625" cx="44.34650455927056" cy="301.44072948328267" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="CTRL · inner1" data-x="-7" data-y="-0.125" cx="44.34650455927056" cy="281.6838905775076" r="3" fill="#65a30d"/></g><g><circle data-type="point" data-label="DATA1 · inner1" data-x="-7" data-y="0.375" cx="44.34650455927056" cy="261.9270516717325" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="CLK_P · inner2" data-x="-7" data-y="-0.375" cx="44.34650455927056" cy="291.56231003039517" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="CLK_N · inner2" data-x="-7" data-y="0.125" cx="44.34650455927056" cy="271.80547112462006" r="3" fill="#059669"/></g><g id="crosshair__stack1" style="display: none"><line id="crosshair-h__stack1" y1="0" y2="512" stroke="#666" stroke-width="1.5"/><line id="crosshair-v__stack1" x1="0" x2="600" stroke="#666" stroke-width="1.5"/><text id="coordinates__stack1" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '512');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":39.51367781155015,"c":0,"e":320.9422492401216,"b":0,"d":-39.51367781155015,"f":276.74468085106383};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
