ata-x="6.8" data-y="0" cx="1076" cy="436.75" r="8.4" fill="#65a30d70" stroke="#65a30d" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="6" data-y="0.65" cx="1020" cy="391.25" r="8.4" fill="#2563eb70" stroke="#2563eb" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="6" data-y="-0.65" cx="1020" cy="482.25" r="8.4" fill="#05966970" stroke="#059669" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="6" data-y="1.25" cx="1020" cy="349.25" r="8.4" fill="#d9770670" stroke="#d97706" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="6" data-y="-1.25" cx="1020" cy="524.25" r="8.4" fill="#7c3aed70" stroke="#7c3aed" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="-6" data-y="0" cx="180" cy="436.75" r="4.9" fill="#0f172a" stroke="#ffffff" stroke-width="0.014285714285714285"/><text data-type="text" data-label="source" data-x="-6" data-y="3.35" x="180" y="202.25" fill="#334155" font-size="23.8" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">source</text><text data-type="text" data-label="middle" data-x="0" data-y="3.1" x="600" y="219.75" fill="#334155" font-size="23.8" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">middle</text><text data-type="text" data-label="target" data-x="6" data-y="3.6" x="1020" y="184.75" fill="#334155" font-size="23.8" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">target</text><text data-type="text" data-label="Step 1 · Derive reference order" data-x="-8" data-y="4.3" x="40" y="135.75" fill="#0f172a" font-size="29.4" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Step 1 · Derive reference order</text><text data-type="text" data-label="Reference region “source” finalized; buses are contiguous and differential pairs are atomic" data-x="-8" data-y="3.93" x="40" y="161.64999999999998" fill="#475569" font-size="17.5" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Reference region “source” finalized; buses are contiguous and differential pairs are atomic</text><text data-type="text" data-label="1 · DATA0" data-x="-5.82" data-y="-1.4200000000000002" x="192.59999999999997" y="536.15" fill="#7c3aed" font-size="14.7" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">1 · DATA0</text><text data-type="text" data-label="2 · CTRL" data-x="-5.0200000000000005" data-y="0.18" x="248.59999999999997" y="424.15" fill="#65a30d" font-size="14.7" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">2 · CTRL</text><text data-type="text" data-label="3 · DATA1" data-x="-5.82" data-y="1.78" x="192.59999999999997" y="312.15" fill="#d97706" font-size="14.7" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">3 · DATA1</text><text data-type="text" data-label="4 · CLK_P" data-x="-5.82" data-y="-0.37000000000000005" x="192.59999999999997" y="462.65" fill="#2563eb" font-size="14.7" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">4 · CLK_P</text><text data-type="text" data-label="5 · CLK_N" data-x="-5.82" data-y="0.73" x="192.59999999999997" y="385.65" fill="#059669" font-size="14.7" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">5 · CLK_N</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":70,"c":0,"e":600,"b":0,"d":-70,"f":436.75};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>