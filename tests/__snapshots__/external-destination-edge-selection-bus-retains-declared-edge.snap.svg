y="3.05" x="137.196261682243" y="174.19314641744546" fill="#0f172a" font-size="13.607476635514022" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-2" data-y="2.68" x="137.196261682243" y="186.1806853582554" fill="#475569" font-size="8.099688473520251" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="DATA_1 · top" data-x="2" data-y="-0.25" cx="266.79127725856705" cy="281.10903426791276" r="3" fill="#dc2626"/><text x="271.79127725856705" y="276.10903426791276" font-family="sans-serif" font-size="12">DATA_1 · top</text></g><g><circle data-type="point" data-label="DATA_2 · top" data-x="2" data-y="0.25" cx="266.79127725856705" cy="264.90965732087227" r="3" fill="#dc2626"/><text x="271.79127725856705" y="259.90965732087227" font-family="sans-serif" font-size="12">DATA_2 · top</text></g><g id="crosshair__stack1__stack1" style="display: none"><line id="crosshair-h__stack1__stack1" y1="0" y2="512" stroke="#666" stroke-width="1.5"/><line id="crosshair-v__stack1__stack1" x1="0" x2="600" stroke="#666" stroke-width="1.5"/><text id="coordinates__stack1__stack1" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
