<svg width="1216" height="600" viewBox="0 0 1216 600" xmlns="http://www.w3.org/2000/svg" data-color-views="connection-and-layer">
  <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="25" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">CONNECTION / NET COLORS</text><text x="16" y="49" font-family="sans-serif" font-size="13" fill="#475569">Each color follows one connection through its assigned gates</text>
  </g>
  <g transform="translate(0, 88) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="0,-0.5 2,-0.25 -5,1" data-type="line" data-label="" points="201.99376947040503,289.208722741433 266.79127725856705,281.10903426791276 40,240.6105919003115" fill="none" stroke="#c2410c55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="0,0.5 2,0.25 -5,1" data-type="line" data-label="" points="201.99376947040503,256.809968847352 266.79127725856705,264.90965732087227 40,240.6105919003115" fill="none" stroke="#2563eb55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="137.196261682243" y="208.2118380062305" width="129.59501557632404" height="129.59501557632404" fill="rgba(226, 232, 240, 0.035)" stroke="rgba(71, 85, 105, 0.55)" stroke-width="1.5"/></g><circle data-type="circle" data-label="" data-x="0" data-y="-0.5" cx="201.99376947040503" cy="289.208722741433" r="3.8878504672897205" fill="#c2410c70" stroke="#c2410c" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="0" data-y="0.5" cx="201.99376947040503" cy="256.809968847352" r="3.8878504672897205" fill="#2563eb70" stroke="#2563eb" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="2" data-y="-0.25" cx="266.79127725856705" cy="281.10903426791276" r="3.5638629283489105" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="2" data-y="0.25" cx="266.79127725856705" cy="264.90965732087227" r="3.5638629283489105" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><text data-type="text" data-label="controller" data-x="0" data-y="2.35" x="201.99376947040503" y="196.87227414330215" fill="#334155" font-size="11.015576323987542" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">controller</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-2" data-y="3.05" x="137.196261682243" y="174.19314641744546" fill="#0f172a" font-size="13.607476635514022" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-2" data-y="2.68" x="137.196261682243" y="186.1806853582554" fill="#475569" font-size="8.099688473520251" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="DATA_1 · top" data-x="2" data-y="-0.25" cx="266.79127725856705" cy="281.10903426791276" r="3" fill="#c2410c"/><text x="271.79127725856705" y="276.10903426791276" font-family="sans-serif" font-size="12">DATA_1 · top</text></g><g><circle data-type="point" data-label="DATA_2 · top" data-x="2" data-y="0.25" cx="266.79127725856705" cy="264.90965732087227" r="3" fill="#2563eb"/><text x="271.79127725856705" y="259.90965732087227" font-family="sans-serif" font-size="12">DATA_2 · top</text></g><g id="crosshair__stack1" style="display: none"><line id="crosshair-h__stack1" y1="0" y2="512" stroke="#666" stroke-width="1.5"/><line id="crosshair-v__stack1" x1="0" x2="600" stroke="#666" stroke-width="1.5"/><text id="coordinates__stack1" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '512');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":32.398753894081004,"c":0,"e":201.99376947040503,"b":0,"d":-32.398753894081004,"f":273.0093457943925};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
  </g>
  <g transform="translate(616, 0) scale(1, 1) translate(0, 0)">
