<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="-6,-1.6 -7,-0.625 -7.75,-2" data-type="line" data-label="" points="182.02898550724638,572.463768115942 100.86956521739137,493.3333333333333 40,604.927536231884" fill="none" stroke="#7c3aed55" stroke-linejoin="round" stroke-width="0.9739130434782609" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-5.2,0 -7,-0.125 -7.75,0" data-type="line" data-label="" points="246.95652173913044,442.6086956521739 100.86956521739137,452.75362318840575 40,442.6086956521739" fill="none" stroke="#65a30d55" stroke-linejoin="round" stroke-width="0.9739130434782609" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,1.6 -7,0.375 -7.75,2" data-type="line" data-label="" points="182.02898550724638,312.75362318840575 100.86956521739137,412.17391304347825 40,280.28985507246375" fill="none" stroke="#d9770655" stroke-linejoin="round" stroke-width="0.9739130434782609" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,-0.55 -7,-0.375 -7.75,-1" data-type="line" data-label="" points="182.02898550724638,487.2463768115942 100.86956521739137,473.0434782608695 40,523.768115942029" fill="none" stroke="#2563eb55" stroke-linejoin="round" stroke-width="0.9739130434782609" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,0.55 -7,0.125 -7.75,1" data-type="line" data-label="" points="182.02898550724638,397.97101449275357 100.86956521739137,432.463768115942 40,361.4492753623188" fill="none" stroke="#05966955" stroke-linejoin="round" stroke-width="0.9739130434782609" stroke-dasharray="0.025 0.07"/></g><g><rect data-type="rect" data-label="" data-x="-6" data-y="0" x="100.86956521739131" y="199.13043478260863" width="162.31884057971013" height="486.9565217391305" fill="rgba(226, 232, 240, 0.035)" stroke="rgba(71, 85, 105, 0.55)" stroke-width="0.01232142857142857"/></g><circle data-type="circle" data-label="" data-x="-5.2" data-y="0" cx="246.95652173913044" cy="442.6086956521739" r="9.73913043478261" fill="#65a30d70" stroke="#65a30d" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-6" data-y="-0.55" cx="182.02898550724638" cy="487.2463768115942" r="9.73913043478261" fill="#2563eb70" stroke="#2563eb" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-6" data-y="0.55" cx="182.02898550724638" cy="397.97101449275357" r="9.73913043478261" fill="#05966970" stroke="#059669" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-6" data-y="1.6" cx="182.02898550724638" cy="312.75362318840575" r="9.73913043478261" fill="#d9770670" stroke="#d97706" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-6" data-y="-1.6" cx="182.02898550724638" cy="572.463768115942" r="9.73913043478261" fill="#7c3aed70" stroke="#7c3aed" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.625" cx="100.86956521739137" cy="493.3333333333333" r="8.927536231884059" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.125" cx="100.86956521739137" cy="452.75362318840575" r="8.927536231884059" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-7" data-y="0.375" cx="100.86956521739137" cy="412.17391304347825" r="8.927536231884059" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.375" cx="100.86956521739137" cy="473.0434782608695" r="8.927536231884059" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.01232142857142857"/><circle data-type="circle" data-label="" data-x="-7" data-y="0.125" cx="100.86956521739137" cy="432.463768115942" r="8.927536231884059" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.01232142857142857"/><text data-type="text" data-label="source" data-x="-6" data-y="3.35" x="182.02898550724638" y="170.72463768115938" fill="#334155" font-size="27.59420289855073" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">source</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-7" data-y="4.05" x="100.86956521739137" y="113.91304347826082" fill="#0f172a" font-size="34.08695652173913" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-7" data-y="3.68" x="100.86956521739137" y="143.9420289855072" fill="#475569" font-size="20.28985507246377" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="DATA0 · inner1" data-x="-7" data-y="-0.625" cx="100.86956521739137" cy="493.3333333333333" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="CTRL · inner1" data-x="-7" data-y="-0.125" cx="100.86956521739137" cy="452.75362318840575" r="3" fill="#65a30d"/></g><g><circle data-type="point" data-label="DATA1 · inner1" data-x="-7" data-y="0.375" cx="100.86956521739137" cy="412.17391304347825" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="CLK_P · inner2" data-x="-7" data-y="-0.375" cx="100.86956521739137" cy="473.0434782608695" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="CLK_N · inner2" data-x="-7" data-y="0.125" cx="100.86956521739137" cy="432.463768115942" r="3" fill="#059669"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":81.15942028985508,"c":0,"e":668.9855072463769,"b":0,"d":-81.15942028985508,"f":442.6086956521739};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>