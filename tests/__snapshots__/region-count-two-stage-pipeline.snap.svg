  <g transform="translate(0, 88) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="-6,-1.6 -7,-0.625 -7.75,-2" data-type="line" data-label="" points="105.94202898550722,336.072463768116 68.26086956521738,299.33333333333337 39.99999999999994,351.1449275362319" fill="none" stroke="#7c3aed55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-5.2,0 -7,-0.125 -7.75,0" data-type="line" data-label="" points="136.0869565217391,275.7826086956522 68.26086956521738,280.49275362318843 39.99999999999994,275.7826086956522" fill="none" stroke="#65a30d55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,1.6 -7,0.375 -7.75,2" data-type="line" data-label="" points="105.94202898550722,215.4927536231884 68.26086956521738,261.6521739130435 39.99999999999994,200.42028985507247" fill="none" stroke="#d9770655" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,-0.55 -7,-0.375 -7.75,-1" data-type="line" data-label="" points="105.94202898550722,296.5072463768116 68.26086956521738,289.9130434782609 39.99999999999994,313.46376811594206" fill="none" stroke="#2563eb55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-6,0.55 -7,0.125 -7.75,1" data-type="line" data-label="" points="105.94202898550722,255.05797101449275 68.26086956521738,271.07246376811594 39.99999999999994,238.1014492753623" fill="none" stroke="#05966955" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><rect data-type="rect" data-label="" data-x="-6" data-y="0" x="68.26086956521738" y="162.73913043478262" width="75.36231884057969" height="226.08695652173913" fill="rgba(226, 232, 240, 0.035)" stroke="rgba(71, 85, 105, 0.55)" stroke-width="1.5"/></g><circle data-type="circle" data-label="" data-x="-5.2" data-y="0" cx="136.0869565217391" cy="275.7826086956522" r="4.521739130434783" fill="#65a30d70" stroke="#65a30d" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="-0.55" cx="105.94202898550722" cy="296.5072463768116" r="4.521739130434783" fill="#2563eb70" stroke="#2563eb" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="0.55" cx="105.94202898550722" cy="255.05797101449275" r="4.521739130434783" fill="#05966970" stroke="#059669" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="1.6" cx="105.94202898550722" cy="215.4927536231884" r="4.521739130434783" fill="#d9770670" stroke="#d97706" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-6" data-y="-1.6" cx="105.94202898550722" cy="336.072463768116" r="4.521739130434783" fill="#7c3aed70" stroke="#7c3aed" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.625" cx="68.26086956521738" cy="299.33333333333337" r="4.144927536231885" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.125" cx="68.26086956521738" cy="280.49275362318843" r="4.144927536231885" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="0.375" cx="68.26086956521738" cy="261.6521739130435" r="4.144927536231885" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="-0.375" cx="68.26086956521738" cy="289.9130434782609" r="4.144927536231885" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-7" data-y="0.125" cx="68.26086956521738" cy="271.07246376811594" r="4.144927536231885" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><text data-type="text" data-label="source" data-x="-6" data-y="3.35" x="105.94202898550722" y="149.55072463768116" fill="#334155" font-size="12.811594202898553" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">source</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-7" data-y="4.05" x="68.26086956521738" y="123.17391304347825" fill="#0f172a" font-size="15.82608695652174" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-7" data-y="3.68" x="68.26086956521738" y="137.1159420289855" fill="#475569" font-size="9.420289855072465" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="DATA0 · inner1" data-x="-7" data-y="-0.625" cx="68.26086956521738" cy="299.33333333333337" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="CTRL · inner1" data-x="-7" data-y="-0.125" cx="68.26086956521738" cy="280.49275362318843" r="3" fill="#65a30d"/></g><g><circle data-type="point" data-label="DATA1 · inner1" data-x="-7" data-y="0.375" cx="68.26086956521738" cy="261.6521739130435" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="CLK_P · inner2" data-x="-7" data-y="-0.375" cx="68.26086956521738" cy="289.9130434782609" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="CLK_N · inner2" data-x="-7" data-y="0.125" cx="68.26086956521738" cy="271.07246376811594" r="3" fill="#059669"/></g><g id="crosshair__stack1" style="display: none"><line id="crosshair-h__stack1" y1="0" y2="512" stroke="#666" stroke-width="1.5"/><line id="crosshair-v__stack1" x1="0" x2="600" stroke="#666" stroke-width="1.5"/><text id="coordinates__stack1" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '512');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":37.68115942028986,"c":0,"e":332.0289855072464,"b":0,"d":-37.68115942028986,"f":275.7826086956522};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
