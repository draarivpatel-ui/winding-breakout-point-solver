a-label="" data-x="-20" data-y="-6.400000000000006" cx="479.83193277310943" cy="441.34453781512605" r="4.840336134453782" fill="#9333ea70" stroke="#9333ea" stroke-width="0.024791666666666663"/><circle data-type="circle" data-label="" data-x="-20" data-y="-4.400000000000006" cx="479.83193277310943" cy="360.672268907563" r="4.840336134453782" fill="#0f766e70" stroke="#0f766e" stroke-width="0.024791666666666663"/><text data-type="text" data-label="pcb_group_0" data-x="-19.5" data-y="2.849999999999993" x="500.0000000000001" y="68.23529411764707" fill="#334155" font-size="13.714285714285717" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">pcb_group_0</text><text data-type="text" data-label="Glider U1: placement failed" data-x="-27.9" data-y="3.5499999999999927" x="161.17647058823536" y="40.00000000000003" fill="#0f172a" font-size="16.941176470588236" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Glider U1: placement failed</text><text data-type="text" data-label="54 connections; needs 16.91mm on a 16.80mm edge" data-x="-27.9" data-y="3.179999999999993" x="161.17647058823536" y="54.92436974789916" fill="#475569" font-size="10.08403361344538" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">54 connections; needs 16.91mm on a 16.80mm edge</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40.33613445378152,"c":0,"e":1286.5546218487398,"b":0,"d":-40.33613445378152,"f":183.19327731092412};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>