3793" r="6.620689655172414" fill="#0891b270" stroke="#0891b2" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="0" cx="702.0689655172414" cy="372.2068965517241" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="1" cx="702.0689655172414" cy="317.0344827586207" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="2" cx="702.0689655172414" cy="261.8620689655172" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="3" cx="702.0689655172414" cy="206.68965517241378" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="0.5" cx="702.0689655172414" cy="344.6206896551724" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="1.5" cx="702.0689655172414" cy="289.44827586206895" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="2.5" cx="702.0689655172414" cy="234.2758620689655" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><circle data-type="circle" data-label="" data-x="12" data-y="3.5" cx="702.0689655172414" cy="179.10344827586204" r="6.06896551724138" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="0.018125"/><text data-type="text" data-label="breakout" data-x="6" data-y="3.85" x="371.0344827586207" y="159.79310344827584" fill="#334155" font-size="18.758620689655174" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">breakout</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="0" data-y="4.55" x="40" y="121.17241379310343" fill="#0f172a" font-size="23.17241379310345" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="0" data-y="4.18" x="40" y="141.58620689655172" fill="#475569" font-size="13.793103448275863" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="CLK_P · bottom" data-x="12" data-y="0" cx="702.0689655172414" cy="372.2068965517241" r="3" fill="#2563eb"/><text x="707.0689655172414" y="367.2068965517241" font-family="sans-serif" font-size="12">CLK_P · bottom</text></g><g><circle data-type="point" data-label="CLK_N · bottom" data-x="12" data-y="1" cx="702.0689655172414" cy="317.0344827586207" r="3" fill="#059669"/><text x="707.0689655172414" y="312.0344827586207" font-family="sans-serif" font-size="12">CLK_N · bottom</text></g><g><circle data-type="point" data-label="DQS_P · bottom" data-x="12" data-y="2" cx="702.0689655172414" cy="261.8620689655172" r="3" fill="#2563eb"/><text x="707.0689655172414" y="256.8620689655172" font-family="sans-serif" font-size="12">DQS_P · bottom</text></g><g><circle data-type="point" data-label="DQS_N · bottom" data-x="12" data-y="3" cx="702.0689655172414" cy="206.68965517241378" r="3" fill="#db2777"/><text x="707.0689655172414" y="201.68965517241378" font-family="sans-serif" font-size="12">DQS_N · bottom</text></g><g><circle data-type="point" data-label="CMD · top" data-x="12" data-y="0.5" cx="702.0689655172414" cy="344.6206896551724" r="3" fill="#4f46e5"/><text x="707.0689655172414" y="339.6206896551724" font-family="sans-serif" font-size="12">CMD · top</text></g><g><circle data-type="point" data-label="DATA · top" data-x="12" data-y="1.5" cx="702.0689655172414" cy="289.44827586206895" r="3" fill="#dc2626"/><text x="707.0689655172414" y="284.44827586206895" font-family="sans-serif" font-size="12">DATA · top</text></g><g><circle data-type="point" data-label="RESET_N · top" data-x="12" data-y="2.5" cx="702.0689655172414" cy="234.2758620689655" r="3" fill="#c2410c"/><text x="707.0689655172414" y="229.2758620689655" font-family="sans-serif" font-size="12">RESET_N · top</text></g><g><circle data-type="point" data-label="IRQ · top" data-x="12" data-y="3.5" cx="702.0689655172414" cy="179.10344827586204" r="3" fill="#0891b2"/><text x="707.0689655172414" y="174.10344827586204" font-family="sans-serif" font-size="12">IRQ · top</text></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="500" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '500');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":55.17241379310345,"c":0,"e":40,"b":0,"d":-55.17241379310345,"f":372.2068965517241};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>