1.45" cx="726.5900383141764" cy="569.5019157088122" r="10.298850574712645" fill="#d9770670" stroke="#d97706" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="0" data-y="1.45" cx="726.5900383141764" cy="320.61302681992333" r="10.298850574712645" fill="#7c3aed70" stroke="#7c3aed" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-4" data-y="-0.625" cx="383.2950191570882" cy="498.69731800766283" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-4" data-y="-0.125" cx="383.2950191570882" cy="455.7854406130268" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-4" data-y="0.375" cx="383.2950191570882" cy="412.87356321839076" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-4" data-y="-0.375" cx="383.2950191570882" cy="477.2413793103448" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-4" data-y="0.125" cx="383.2950191570882" cy="434.32950191570876" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="-0.625" cx="554.9425287356323" cy="498.69731800766283" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="-0.125" cx="554.9425287356323" cy="455.7854406130268" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="0.375" cx="554.9425287356323" cy="412.87356321839076" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="-0.375" cx="554.9425287356323" cy="477.2413793103448" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="0.125" cx="554.9425287356323" cy="434.32950191570876" r="9.440613026819925" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><text data-type="text" data-label="source" data-x="-6" data-y="3.35" x="211.64750957854403" y="157.54789272030644" fill="#334155" font-size="29.1800766283525" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">source</text><text data-type="text" data-label="middle" data-x="0" data-y="3.1" x="726.5900383141764" y="179.00383141762444" fill="#334155" font-size="29.1800766283525" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">middle</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-8" data-y="4.05" x="40" y="97.47126436781605" fill="#0f172a" font-size="36.04597701149426" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-8" data-y="3.68" x="40" y="129.22605363984667" fill="#475569" font-size="21.45593869731801" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="DATA0 · inner1" data-x="-4" data-y="-0.625" cx="383.2950191570882" cy="498.69731800766283" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="CTRL · inner1" data-x="-4" data-y="-0.125" cx="383.2950191570882" cy="455.7854406130268" r="3" fill="#65a30d"/></g><g><circle data-type="point" data-label="DATA1 · inner1" data-x="-4" data-y="0.375" cx="383.2950191570882" cy="412.87356321839076" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="CLK_P · inner2" data-x="-4" data-y="-0.375" cx="383.2950191570882" cy="477.2413793103448" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="CLK_N · inner2" data-x="-4" data-y="0.125" cx="383.2950191570882" cy="434.32950191570876" r="3" fill="#059669"/></g><g><circle data-type="point" data-label="DATA0 · inner1" data-x="-2" data-y="-0.625" cx="554.9425287356323" cy="498.69731800766283" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="CTRL · inner1" data-x="-2" data-y="-0.125" cx="554.9425287356323" cy="455.7854406130268" r="3" fill="#65a30d"/></g><g><circle data-type="point" data-label="DATA1 · inner1" data-x="-2" data-y="0.375" cx="554.9425287356323" cy="412.87356321839076" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="CLK_P · inner2" data-x="-2" data-y="-0.375" cx="554.9425287356323" cy="477.2413793103448" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="CLK_N · inner2" data-x="-2" data-y="0.125" cx="554.9425287356323" cy="434.32950191570876" r="3" fill="#059669"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="1.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="1.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":85.82375478927204,"c":0,"e":726.5900383141764,"b":0,"d":-85.82375478927204,"f":445.0574712643678};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>