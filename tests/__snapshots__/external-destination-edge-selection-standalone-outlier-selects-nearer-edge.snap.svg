<svg width="1216" height="600" viewBox="0 0 1216 600" xmlns="http://www.w3.org/2000/svg" data-color-views="connection-and-layer">
  <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#ffffff"/><text x="16" y="25" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">CONNECTION / NET COLORS</text><text x="16" y="49" font-family="sans-serif" font-size="13" fill="#475569">Each color follows one connection through its assigned gates</text>
  </g>
  <g transform="translate(0, 88) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="-0.5,-1.5 2,-0.25 5,-1.5" data-type="line" data-label="" points="160.93023255813955,325.9667774086378 247.3089700996678,282.77740863787375 350.96345514950167,325.9667774086378" fill="none" stroke="#65a30d55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="1.5,-0.5 -2,-1 -4,-1" data-type="line" data-label="" points="230.03322259136215,291.41528239202654 109.1029900332226,308.6910299003322 40,308.6910299003322" fill="none" stroke="#d9770655" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-0.5,1.5 2,0.25 5,1.5" data-type="line" data-label="" points="160.93023255813955,222.31229235880394 247.3089700996678,265.50166112956805 350.96345514950167,222.31229235880394" fill="none" stroke="#0891b255" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="109.1029900332226" y="205.03654485049833" width="138.2059800664452" height="138.20598006644516" fill="rgba(226, 232, 240, 0.035)" stroke="rgba(71, 85, 105, 0.55)" stroke-width="1.5"/></g><circle data-type="circle" data-label="" data-x="1.5" data-y="-0.5" cx="230.03322259136215" cy="291.41528239202654" r="4.146179401993356" fill="#d9770670" stroke="#d97706" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="-1.5" cx="160.93023255813955" cy="325.9667774086378" r="4.146179401993356" fill="#65a30d70" stroke="#65a30d" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="1.5" cx="160.93023255813955" cy="222.31229235880394" r="4.146179401993356" fill="#0891b270" stroke="#0891b2" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="2" data-y="-0.25" cx="247.3089700996678" cy="282.77740863787375" r="3.800664451827243" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="-1" cx="109.1029900332226" cy="308.6910299003322" r="3.800664451827243" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="2" data-y="0.25" cx="247.3089700996678" cy="265.50166112956805" r="3.800664451827243" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><text data-type="text" data-label="controller" data-x="0" data-y="2.35" x="178.2059800664452" y="192.94352159468434" fill="#334155" font-size="11.747508305647843" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">controller</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-2" data-y="3.05" x="109.1029900332226" y="168.75747508305645" fill="#0f172a" font-size="14.511627906976745" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-2" data-y="2.68" x="109.1029900332226" y="181.54152823920262" fill="#475569" font-size="8.637873754152825" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="HEADER_1 · top" data-x="2" data-y="-0.25" cx="247.3089700996678" cy="282.77740863787375" r="3" fill="#65a30d"/><text x="252.3089700996678" y="277.77740863787375" font-family="sans-serif" font-size="12">HEADER_1 · top</text></g><g><circle data-type="point" data-label="RESET · top" data-x="-2" data-y="-1" cx="109.1029900332226" cy="308.6910299003322" r="3" fill="#d97706"/><text x="114.1029900332226" y="303.6910299003322" font-family="sans-serif" font-size="12">RESET · top</text></g><g><circle data-type="point" data-label="HEADER_2 · top" data-x="2" data-y="0.25" cx="247.3089700996678" cy="265.50166112956805" r="3" fill="#0891b2"/><text x="252.3089700996678" y="260.50166112956805" font-family="sans-serif" font-size="12">HEADER_2 · top</text></g><g id="crosshair__stack1" style="display: none"><line id="crosshair-h__stack1" y1="0" y2="512" stroke="#666" stroke-width="1.5"/><line id="crosshair-v__stack1" x1="0" x2="600" stroke="#666" stroke-width="1.5"/><text id="coordinates__stack1" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '512');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":34.5514950166113,"c":0,"e":178.2059800664452,"b":0,"d":-34.5514950166113,"f":274.1395348837209};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
  </g>
  </g>
