<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><g><polyline data-points="-0.5,-1.5 2,-0.25 5,-1.5" data-type="line" data-label="" points="300.4651162790698,550.6976744186046 486.51162790697674,457.6744186046511 709.7674418604652,550.6976744186046" fill="none" stroke="#65a30d55" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="1.5,-0.5 -2,-1 -4,-1" data-type="line" data-label="" points="449.3023255813954,476.27906976744185 188.8372093023256,513.4883720930233 40,513.4883720930233" fill="none" stroke="#d9770655" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><polyline data-points="-0.5,1.5 2,0.25 5,1.5" data-type="line" data-label="" points="300.4651162790698,327.4418604651163 486.51162790697674,420.4651162790698 709.7674418604652,327.4418604651163" fill="none" stroke="#0891b255" stroke-linejoin="round" stroke-width="1.5" stroke-dasharray="0.025 0.07"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="188.83720930232562" y="290.23255813953483" width="297.6744186046511" height="297.67441860465124" fill="rgba(226, 232, 240, 0.035)" stroke="rgba(71, 85, 105, 0.55)" stroke-width="1.5"/></g><circle data-type="circle" data-label="" data-x="1.5" data-y="-0.5" cx="449.3023255813954" cy="476.27906976744185" r="8.930232558139535" fill="#d9770670" stroke="#d97706" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="-1.5" cx="300.4651162790698" cy="550.6976744186046" r="8.930232558139535" fill="#65a30d70" stroke="#65a30d" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="1.5" cx="300.4651162790698" cy="327.4418604651163" r="8.930232558139535" fill="#0891b270" stroke="#0891b2" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="2" data-y="-0.25" cx="486.51162790697674" cy="457.6744186046511" r="8.186046511627907" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="-2" data-y="-1" cx="188.8372093023256" cy="513.4883720930233" r="8.186046511627907" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><circle data-type="circle" data-label="" data-x="2" data-y="0.25" cx="486.51162790697674" cy="420.4651162790698" r="8.186046511627907" fill="rgba(15, 23, 42, 0.06)" stroke="#475569" stroke-width="1.5"/><text data-type="text" data-label="controller" data-x="0" data-y="2.35" x="337.6744186046512" y="264.18604651162786" fill="#334155" font-size="25.30232558139535" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">controller</text><text data-type="text" data-label="Output · Validated after gate placement" data-x="-2" data-y="3.05" x="188.8372093023256" y="212.09302325581393" fill="#0f172a" font-size="31.255813953488374" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output · Validated after gate placement</text><text data-type="text" data-label="Valid: one bus-constrained breakout point per connection and region; pairs are adjacent" data-x="-2" data-y="2.68" x="188.8372093023256" y="239.62790697674416" fill="#475569" font-size="18.6046511627907" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Valid: one bus-constrained breakout point per connection and region; pairs are adjacent</text><g><circle data-type="point" data-label="HEADER_1 · top" data-x="2" data-y="-0.25" cx="486.51162790697674" cy="457.6744186046511" r="3" fill="#65a30d"/><text x="491.51162790697674" y="452.6744186046511" font-family="sans-serif" font-size="12">HEADER_1 · top</text></g><g><circle data-type="point" data-label="RESET · top" data-x="-2" data-y="-1" cx="188.8372093023256" cy="513.4883720930233" r="3" fill="#d97706"/><text x="193.8372093023256" y="508.48837209302326" font-family="sans-serif" font-size="12">RESET · top</text></g><g><circle data-type="point" data-label="HEADER_2 · top" data-x="2" data-y="0.25" cx="486.51162790697674" cy="420.4651162790698" r="3" fill="#0891b2"/><text x="491.51162790697674" y="415.4651162790698" font-family="sans-serif" font-size="12">HEADER_2 · top</text></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="1.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="1.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":74.4186046511628,"c":0,"e":337.6744186046512,"b":0,"d":-74.4186046511628,"f":439.06976744186045};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>