fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ2 · soc" data-x="-4.5" data-y="-3" cx="246.50310211052127" cy="754.5655402727381" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ2 · ram" data-x="5.891917" data-y="-3.650917" cx="253.9065974101967" cy="755.0292719355274" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ3 · soc" data-x="-4.5" data-y="-3.5" cx="246.50310211052127" cy="754.9217544004912" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ3 · ram" data-x="6.541917" data-y="-3.650917" cx="254.36967577627573" cy="755.0292719355274" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ4 · soc" data-x="-6" data-y="-2.5" cx="245.43445972726192" cy="754.209326144985" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ4 · ram" data-x="6.541917" data-y="-2.050917" cx="254.36967577627573" cy="753.8893867267175" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ5 · soc" data-x="-6" data-y="-2" cx="245.43445972726192" cy="753.8531120172319" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ5 · ram" data-x="5.891917" data-y="-2.050917" cx="253.9065974101967" cy="753.8893867267175" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ6 · soc" data-x="-5" data-y="-2" cx="246.14688798276813" cy="753.8531120172319" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ6 · ram" data-x="4.591917" data-y="-2.050917" cx="252.9804406780386" cy="753.8893867267175" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ7 · soc" data-x="-5.5" data-y="-2" cx="245.79067385501503" cy="753.8531120172319" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ7 · ram" data-x="3.941917" data-y="-2.050917" cx="252.51736231195954" cy="753.8893867267175" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DM0 · soc" data-x="-5" data-y="-3" cx="246.14688798276813" cy="754.5655402727381" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DM0 · ram" data-x="4.591917" data-y="-2.850917" cx="252.9804406780386" cy="754.4593293311225" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0 · soc" data-x="-4.5" data-y="-2.5" cx="246.50310211052127" cy="754.209326144985" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0 · ram" data-x="5.241917" data-y="-2.850917" cx="253.44351904411764" cy="754.4593293311225" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0_n · soc" data-x="-5" data-y="-2.5" cx="246.14688798276813" cy="754.209326144985" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0_n · ram" data-x="5.891917" data-y="-2.850917" cx="253.9065974101967" cy="754.4593293311225" r="3" fill="#dc2626"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":0.7124282555062195,"c":0,"e":249.70902926029925,"b":0,"d":-0.7124282555062195,"f":752.4282555062194};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>