<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><g><rect data-type="rect" data-label="soc" data-x="-9.5" data-y="0" x="39.99999999999997" y="68.92578104047584" width="459.2148569929414" height="684.6966135775046" fill="rgba(254, 226, 226, 0.2)" stroke="#ef4444" stroke-width="1.5"/></g><g><rect data-type="rect" data-label="ram" data-x="9.616916999999999" data-y="-0.0509170000000001" x="610.7908643190276" y="103.68208659897209" width="549.2091356809724" height="618.4642466319453" fill="rgba(254, 226, 226, 0.2)" stroke="#ef4444" stroke-width="1.5"/></g><text data-type="text" data-label="Input validation failed" data-x="-16.62808" data-y="11.32808" x="40" y="46.37760538201945" fill="#991b1b" font-size="10.951971034107366" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input validation failed</text><text data-type="text" data-label="WindingBreakoutSolver: connections[0].endpoints[0].externalDestination.x must be finite" data-x="-16.62808" data-y="10.97808" x="40" y="57.65169321124762" fill="#7f1d1d" font-size="6.442335902416097" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">WindingBreakoutSolver: connections[0].endpoints[0].externalDestination.x must be finite</text><g><circle data-type="point" data-label="DQ0 · soc" data-x="-6" data-y="-3" cx="382.3483067887524" cy="507.90912636546966" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ0 · ram" data-x="3.941917" data-y="-3.650917" cx="702.5941509284571" cy="528.8762561584346" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ1 · soc" data-x="-5.5" data-y="-3" cx="398.45414654479265" cy="507.90912636546966" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ1 · ram" data-x="4.591917" data-y="-3.650917" cx="723.5317426113094" cy="528.8762561584346" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ2 · soc" data-x="-4.5" data-y="-3" cx="430.66582605687313" cy="507.90912636546966" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ2 · ram" data-x="5.891917" data-y="-3.650917" cx="765.406925977014" cy="528.8762561584346" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ3 · soc" data-x="-4.5" data-y="-3.5" cx="430.66582605687313" cy="524.0149661215098" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ3 · ram" data-x="6.541917" data-y="-3.650917" cx="786.3445176598664" cy="528.8762561584346" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ4 · soc" data-x="-6" data-y="-2.5" cx="382.3483067887524" cy="491.8032866094294" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ4 · ram" data-x="6.541917" data-y="-2.050917" cx="786.3445176598664" cy="477.3375689391057" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ5 · soc" data-x="-6" data-y="-2" cx="382.3483067887524" cy="475.6974468533891" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ5 · ram" data-x="5.891917" data-y="-2.050917" cx="765.406925977014" cy="477.3375689391057" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ6 · soc" data-x="-5" data-y="-2" cx="414.55998630083286" cy="475.6974468533891" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ6 · ram" data-x="4.591917" data-y="-2.050917" cx="723.5317426113094" cy="477.3375689391057" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ7 · soc" data-x="-5.5" data-y="-2" cx="398.45414654479265" cy="475.6974468533891" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQ7 · ram" data-x="3.941917" data-y="-2.050917" cx="702.5941509284571" cy="477.3375689391057" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DM0 · soc" data-x="-5" data-y="-3" cx="414.55998630083286" cy="507.90912636546966" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DM0 · ram" data-x="4.591917" data-y="-2.850917" cx="723.5317426113094" cy="503.10691254877014" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0 · soc" data-x="-4.5" data-y="-2.5" cx="430.66582605687313" cy="491.8032866094294" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0 · ram" data-x="5.241917" data-y="-2.850917" cx="744.4693342941617" cy="503.10691254877014" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0_n · soc" data-x="-5" data-y="-2.5" cx="414.55998630083286" cy="491.8032866094294" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="DQS0_n · ram" data-x="5.891917" data-y="-2.850917" cx="765.406925977014" cy="503.10691254877014" r="3" fill="#dc2626"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="1.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="1.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":32.21167951208049,"c":0,"e":575.6183838612353,"b":0,"d":-32.21167951208049,"f":411.27408782922816};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>